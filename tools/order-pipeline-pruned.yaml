AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Order intake and fulfillment pipeline. Provisions ingest/process/report Lambda
  functions, the messaging and storage layer they use, a Step Functions
  reconciliation workflow, and the IAM roles used by CI/CD to deploy this stack.

Parameters:
  ProjectName:
    Type: String
    Default: order-pipeline
    Description: Prefix applied to all resource names.
    AllowedPattern: "[a-z0-9-]+"

  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, stage, prod]

  LogRetentionDays:
    Type: Number
    Default: 14
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90]

  ReportSchedule:
    Type: String
    Default: "rate(1 day)"
    Description: EventBridge schedule expression for the nightly report job.

  NotificationEmail:
    Type: String
    Default: ""
    Description: Optional email address subscribed to the order notification topic.

Conditions:
  HasNotificationEmail: !Not [!Equals [!Ref NotificationEmail, ""]]
  IsProd: !Equals [!Ref Environment, prod]

Resources:

  ##########################################################################
  # Storage / messaging layer
  ##########################################################################

  OrdersBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketName: !Sub "${ProjectName}-${Environment}-${AWS::AccountId}-orders"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: expire-raw-payloads
            Status: Enabled
            Prefix: raw/
            ExpirationInDays: 30
          - Id: abort-incomplete-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  OrdersBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref OrdersBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowAccountAccess
            Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"
            Action: "s3:*"
            Resource:
              - !GetAtt OrdersBucket.Arn
              - !Sub "${OrdersBucket.Arn}/*"

  OrdersTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TableName: !Sub "${ProjectName}-${Environment}-orders"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: orderId
          AttributeType: S
        - AttributeName: status
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: orderId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: status-createdAt-index
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [IsProd, true, false]
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  OrdersDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${ProjectName}-${Environment}-orders-dlq"
      MessageRetentionPeriod: 1209600

  OrdersQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${ProjectName}-${Environment}-orders"
      VisibilityTimeout: 180
      MessageRetentionPeriod: 345600
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt OrdersDeadLetterQueue.Arn
        maxReceiveCount: 5

  OrdersQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref OrdersQueue
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowInternalProducers
            Effect: Allow
            Principal: "*"
            Action: "sqs:*"
            Resource: !GetAtt OrdersQueue.Arn
            Condition:
              StringEquals:
                aws:PrincipalAccount: !Ref AWS::AccountId

  OrderEventsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${ProjectName}-${Environment}-order-events"
      DisplayName: Order Events

  OrderEventsTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref OrderEventsTopic
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowPublishFromAccount
            Effect: Allow
            Principal: "*"
            Action:
              - "sns:Publish"
              - "sns:Subscribe"
              - "sns:GetTopicAttributes"
            Resource: !Ref OrderEventsTopic
            Condition:
              StringEquals:
                aws:PrincipalAccount: !Ref AWS::AccountId

  OrderEventsEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasNotificationEmail
    Properties:
      TopicArn: !Ref OrderEventsTopic
      Protocol: email
      Endpoint: !Ref NotificationEmail

  ##########################################################################
  # Lambda execution roles
  ##########################################################################

  PlatformServicePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${ProjectName}-${Environment}-platform-service"
      Description: Shared baseline policy for all platform compute.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: PlatformBaseline
            Effect: Allow
            Action:
              - "s3:*"
              - "dynamodb:*"
              - "sqs:*"
              - "sns:*"
              - "logs:*"
              - "cloudwatch:*"
              - "kms:*"
              - "secretsmanager:*"
              - "ssm:*"
              - "states:*"
              - "lambda:*"
              - "events:*"
            Resource: "*"
          - Sid: PassAnyRole
            Effect: Allow
            Action:
              - "iam:PassRole"
              - "iam:GetRole"
              - "iam:ListRoles"
            Resource: "*"
          - Sid: AssumeAnyRole
            Effect: Allow
            Action: "sts:AssumeRole"
            Resource: "*"

  IngestFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-${Environment}-ingest-role"
      MaxSessionDuration: 43200
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
                - edgelambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref PlatformServicePolicy
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AmazonS3FullAccess"
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AmazonDynamoDBFullAccess"
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/CloudWatchFullAccess"
      Policies:
        - PolicyName: ingest-extras
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "sqs:*"
                  - "kms:Decrypt"
                  - "kms:GenerateDataKey"
                  - "secretsmanager:GetSecretValue"
                Resource: "*"

  ProcessFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-${Environment}-process-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: process-runtime
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: RuntimeAccess
                Effect: Allow
                Action: "*"
                Resource: "*"

  ReportFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-${Environment}-report-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: report-runtime
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: EverythingExceptOrgChanges
                Effect: Allow
                NotAction:
                  - "organizations:*"
                  - "account:*"
                Resource: "*"

  ReconcileStateMachineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-${Environment}-reconcile-sfn-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: !Sub "states.${AWS::Region}.amazonaws.com"
            Action: sts:AssumeRole
      Policies:
        - PolicyName: reconcile-orchestration
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "lambda:InvokeFunction"
                  - "states:*"
                  - "logs:*"
                  - "xray:*"
                  - "sns:Publish"
                  - "dynamodb:*"
                Resource: "*"

  ##########################################################################
  # Lambda functions
  ##########################################################################

  IngestFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-${Environment}-ingest"
      RetentionInDays: !Ref LogRetentionDays

  IngestFunction:
    Type: AWS::Lambda::Function
    DependsOn: IngestFunctionLogGroup
    Properties:
      FunctionName: !Sub "${ProjectName}-${Environment}-ingest"
      Description: Accepts an order payload, archives it to S3 and enqueues it for processing.
      Runtime: python3.13
      Handler: index.handler
      Role: !GetAtt IngestFunctionRole.Arn
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          ORDERS_BUCKET: !Ref OrdersBucket
          ORDERS_QUEUE_URL: !Ref OrdersQueue
          ORDERS_TABLE: !Ref OrdersTable
          ENVIRONMENT: !Ref Environment
      Code:
        ZipFile: |
          import json
          import logging
          import os
          import uuid
          from datetime import datetime, timezone

          import boto3

          log = logging.getLogger()
          log.setLevel(logging.INFO)

          s3 = boto3.client("s3")
          sqs = boto3.client("sqs")
          ddb = boto3.resource("dynamodb")

          BUCKET = os.environ["ORDERS_BUCKET"]
          QUEUE_URL = os.environ["ORDERS_QUEUE_URL"]
          TABLE = ddb.Table(os.environ["ORDERS_TABLE"])


          def handler(event, context):
              body = event.get("body") or "{}"
              if isinstance(body, str):
                  payload = json.loads(body)
              else:
                  payload = body

              order_id = payload.get("orderId") or str(uuid.uuid4())
              received_at = datetime.now(timezone.utc).isoformat()

              key = f"raw/{received_at[:10]}/{order_id}.json"
              s3.put_object(
                  Bucket=BUCKET,
                  Key=key,
                  Body=json.dumps(payload).encode("utf-8"),
                  ContentType="application/json",
              )

              TABLE.put_item(
                  Item={
                      "orderId": order_id,
                      "status": "RECEIVED",
                      "createdAt": received_at,
                      "rawKey": key,
                      "customerId": payload.get("customerId", "unknown"),
                      "amount": str(payload.get("amount", "0")),
                  }
              )

              sqs.send_message(
                  QueueUrl=QUEUE_URL,
                  MessageBody=json.dumps({"orderId": order_id, "rawKey": key}),
              )

              log.info("accepted order %s", order_id)
              return {
                  "statusCode": 202,
                  "headers": {"content-type": "application/json"},
                  "body": json.dumps({"orderId": order_id, "status": "RECEIVED"}),
              }

  ProcessFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-${Environment}-process"
      RetentionInDays: !Ref LogRetentionDays

  ProcessFunction:
    Type: AWS::Lambda::Function
    DependsOn: ProcessFunctionLogGroup
    Properties:
      FunctionName: !Sub "${ProjectName}-${Environment}-process"
      Description: Drains the order queue, marks orders processed and publishes events.
      Runtime: python3.13
      Handler: index.handler
      Role: !GetAtt ProcessFunctionRole.Arn
      Timeout: 60
      MemorySize: 256
      Environment:
        Variables:
          ORDERS_BUCKET: !Ref OrdersBucket
          ORDERS_TABLE: !Ref OrdersTable
          EVENTS_TOPIC_ARN: !Ref OrderEventsTopic
      Code:
        ZipFile: |
          import json
          import logging
          import os
          from datetime import datetime, timezone

          import boto3

          log = logging.getLogger()
          log.setLevel(logging.INFO)

          s3 = boto3.client("s3")
          sns = boto3.client("sns")
          ddb = boto3.resource("dynamodb")

          BUCKET = os.environ["ORDERS_BUCKET"]
          TOPIC_ARN = os.environ["EVENTS_TOPIC_ARN"]
          TABLE = ddb.Table(os.environ["ORDERS_TABLE"])


          def process_record(record):
              message = json.loads(record["body"])
              order_id = message["orderId"]

              raw = s3.get_object(Bucket=BUCKET, Key=message["rawKey"])
              payload = json.loads(raw["Body"].read())

              TABLE.update_item(
                  Key={"orderId": order_id},
                  UpdateExpression="SET #s = :s, processedAt = :t, lineItems = :n",
                  ExpressionAttributeNames={"#s": "status"},
                  ExpressionAttributeValues={
                      ":s": "PROCESSED",
                      ":t": datetime.now(timezone.utc).isoformat(),
                      ":n": len(payload.get("items", [])),
                  },
              )

              sns.publish(
                  TopicArn=TOPIC_ARN,
                  Subject=f"Order {order_id} processed",
                  Message=json.dumps({"orderId": order_id, "status": "PROCESSED"}),
              )
              log.info("processed order %s", order_id)


          def handler(event, context):
              failures = []
              for record in event.get("Records", []):
                  try:
                      process_record(record)
                  except Exception:
                      log.exception("failed record %s", record.get("messageId"))
                      failures.append({"itemIdentifier": record["messageId"]})
              return {"batchItemFailures": failures}

  ProcessQueueEventSource:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt OrdersQueue.Arn
      FunctionName: !GetAtt ProcessFunction.Arn
      BatchSize: 10
      FunctionResponseTypes:
        - ReportBatchItemFailures

  ReportFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-${Environment}-report"
      RetentionInDays: !Ref LogRetentionDays

  ReportFunction:
    Type: AWS::Lambda::Function
    DependsOn: ReportFunctionLogGroup
    Properties:
      FunctionName: !Sub "${ProjectName}-${Environment}-report"
      Description: Emits a daily rollup of processed orders to S3 and CloudWatch.
      Runtime: python3.13
      Handler: index.handler
      Role: !GetAtt ReportFunctionRole.Arn
      Timeout: 120
      MemorySize: 512
      Environment:
        Variables:
          ORDERS_BUCKET: !Ref OrdersBucket
          ORDERS_TABLE: !Ref OrdersTable
          ORDERS_INDEX: status-createdAt-index
          METRIC_NAMESPACE: !Sub "${ProjectName}/${Environment}"
      Code:
        ZipFile: |
          import json
          import logging
          import os
          from datetime import datetime, timedelta, timezone

          import boto3
          from boto3.dynamodb.conditions import Key

          log = logging.getLogger()
          log.setLevel(logging.INFO)

          s3 = boto3.client("s3")
          cw = boto3.client("cloudwatch")
          ddb = boto3.resource("dynamodb")

          BUCKET = os.environ["ORDERS_BUCKET"]
          INDEX = os.environ["ORDERS_INDEX"]
          NAMESPACE = os.environ["METRIC_NAMESPACE"]
          TABLE = ddb.Table(os.environ["ORDERS_TABLE"])


          def handler(event, context):
              since = (datetime.now(timezone.utc) - timedelta(days=1)).isoformat()

              orders = []
              kwargs = {
                  "IndexName": INDEX,
                  "KeyConditionExpression": Key("status").eq("PROCESSED")
                  & Key("createdAt").gte(since),
              }
              while True:
                  page = TABLE.query(**kwargs)
                  orders.extend(page.get("Items", []))
                  if "LastEvaluatedKey" not in page:
                      break
                  kwargs["ExclusiveStartKey"] = page["LastEvaluatedKey"]

              report = {
                  "generatedAt": datetime.now(timezone.utc).isoformat(),
                  "window": {"from": since},
                  "processedCount": len(orders),
                  "orderIds": [o["orderId"] for o in orders],
              }

              key = f"reports/{report['generatedAt'][:10]}/daily.json"
              s3.put_object(
                  Bucket=BUCKET,
                  Key=key,
                  Body=json.dumps(report, default=str).encode("utf-8"),
                  ContentType="application/json",
              )

              cw.put_metric_data(
                  Namespace=NAMESPACE,
                  MetricData=[
                      {
                          "MetricName": "ProcessedOrders",
                          "Value": len(orders),
                          "Unit": "Count",
                      }
                  ],
              )

              log.info("report written to s3://%s/%s", BUCKET, key)
              return {"processedCount": len(orders), "reportKey": key}

  ReportScheduleRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-report-schedule"
      Description: Triggers the nightly order rollup.
      ScheduleExpression: !Ref ReportSchedule
      State: ENABLED
      Targets:
        - Id: report-function
          Arn: !GetAtt ReportFunction.Arn

  ReportSchedulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ReportFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ReportScheduleRule.Arn

  ##########################################################################
  # Reconciliation workflow
  ##########################################################################

  ReconcileStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub "${ProjectName}-${Environment}-reconcile"
      StateMachineType: STANDARD
      RoleArn: !GetAtt ReconcileStateMachineRole.Arn
      DefinitionString: !Sub |
        {
          "Comment": "Rebuild the daily rollup then notify downstream consumers.",
          "StartAt": "GenerateReport",
          "States": {
            "GenerateReport": {
              "Type": "Task",
              "Resource": "${ReportFunction.Arn}",
              "Retry": [
                {
                  "ErrorEquals": ["States.TaskFailed", "Lambda.ServiceException"],
                  "IntervalSeconds": 5,
                  "MaxAttempts": 3,
                  "BackoffRate": 2
                }
              ],
              "Next": "HasOrders"
            },
            "HasOrders": {
              "Type": "Choice",
              "Choices": [
                {
                  "Variable": "$.processedCount",
                  "NumericGreaterThan": 0,
                  "Next": "Notify"
                }
              ],
              "Default": "NoOp"
            },
            "Notify": {
              "Type": "Task",
              "Resource": "arn:${AWS::Partition}:states:::sns:publish",
              "Parameters": {
                "TopicArn": "${OrderEventsTopic}",
                "Subject": "Daily reconciliation complete",
                "Message.$": "States.JsonToString($)"
              },
              "End": true
            },
            "NoOp": {
              "Type": "Succeed"
            }
          }
        }

Outputs:
  OrdersBucketName:
    Value: !Ref OrdersBucket

  OrdersTableName:
    Value: !Ref OrdersTable

  OrdersQueueUrl:
    Value: !Ref OrdersQueue

  OrderEventsTopicArn:
    Value: !Ref OrderEventsTopic

  ReconcileStateMachineArn:
    Value: !Ref ReconcileStateMachine

