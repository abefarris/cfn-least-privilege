# Tool configuration only. This project is a set of scripts, not a package, so
# there is deliberately no [project] or [build-system] table -- adding them
# would imply a distributable library with consumers, which this is not.

[tool.pytest.ini_options]
testpaths = ["tests"]
# Unknown markers become errors rather than silently collecting nothing: a
# typo'd @pytest.mark.destructive that runs by accident is the worst outcome
# available here.
addopts = "--strict-markers"

[tool.ruff]
line-length = 80
target-version = "py310"
src = ["tools", "tests"]

[tool.ruff.lint]
# F catches the class of defect that made four of five scripts unrunnable:
# F821 undefined-name would have flagged HERE-before-definition for free.
select = ["E", "W", "F", "I", "B", "N", "D", "UP"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Every tool sets sys.path before importing discover, so the import cannot be
# at the top. The line already carries a noqa; this keeps it from being noise.
"tools/*.py" = ["E402"]
# conftest.py does the same sys.path insert for the suite. Test functions are
# named for what they assert and read better without a docstring convention
# forcing a summary line onto a fixture that is one expression long.
"tests/*.py" = ["E402"]

[tool.pyink]
line-length = 80
pyink-indentation = 4
pyink-use-majority-quotes = true

[tool.pylint.main]
# Google publishes a pylintrc at
# https://google.github.io/styleguide/pylintrc -- fetch it with `make pylintrc`
# to run the full Google rule set.
py-version = "3.10"

[tool.pylint."messages control"]
# W1405 inconsistent-quotes is unsatisfiable alongside pyink: pyink normalises
# outer quotes to ", which forces ' inside f-string expressions, and pylint
# then flags exactly that. The two rules cannot both hold.
disable = ["inconsistent-quotes"]

[tool.pylint.format]
max-line-length = 80
